[pytest]
# Coloca a raiz do repositorio no sys.path para que `import feedbackloop`
# funcione independentemente de como o pytest e invocado.
#
# Sem isto, `python -m pytest` funciona (o -m insere o diretorio atual no
# sys.path) e `pytest` puro falha. O pipeline usa a segunda forma, entao a
# divergencia so aparecia no CI, nunca na maquina de quem escreveu o teste.
#
# O tests/test_pipeline.py herdado contorna isso com um sys.path.insert manual.
# Esta configuracao resolve no lugar certo, para todos os testes de uma vez.
pythonpath = .
